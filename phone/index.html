<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-title" content="Nixa">
<title>Nixa</title>
<style>
:root { color-scheme: dark; --bg: #0f1117; --surface: #161923; --raised: #1c2030; --border: #2a2f3d; --fg: #c0caf5; --dim: #737aa2; --ok: #9ece6a; --bad: #f7768e; --wait: #e0af68; --blue: #7aa2f7; --pink: #f19ac7; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
body { overflow: hidden; }
button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; -webkit-tap-highlight-color: transparent; }
button:active { background: var(--raised); }
svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#app { height: 100dvh; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 8px) 14px calc(env(safe-area-inset-bottom, 0px) + 10px); gap: 8px; }
header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: ui-monospace, Menlo, monospace; letter-spacing: 1px; }
.tag { font-size: 10px; color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; letter-spacing: 0.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); }
.dot.on { background: var(--ok); }
.dot.off { background: var(--bad); }
.toggles { display: flex; gap: 6px; }
.tog { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 5px 10px; border-radius: 999px; color: var(--dim); }
.tog.on { color: var(--ok); border-color: rgba(158, 206, 106, 0.6); }
.tog.warn { color: var(--wait); border-color: rgba(224, 175, 104, 0.6); }
.tog.round { padding: 5px 7px; }
#hint { flex: none; font-size: 12px; text-align: center; color: var(--wait); }
#corebox { position: relative; flex: none; height: min(56vw, 30dvh, 340px); display: grid; place-items: center; min-height: 84px; }
#app.full #corebox { flex: 1; height: auto; }
#app.full #chat { display: none; }
#core { display: block; }
#chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; overscroll-behavior: contain; }
.msg { position: relative; max-width: 86%; padding: 8px 11px; border-radius: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg .kind { position: absolute; top: -6px; right: 8px; padding: 0 5px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-size: 8.5px; line-height: 1.6; letter-spacing: 0.04em; color: var(--dim); pointer-events: none; }
.msg .meta { display: block; margin-top: 3px; font-size: 10.5px; color: var(--dim); }
.user { align-self: flex-end; background: #22304f; border-bottom-right-radius: 4px; }
.nixa { align-self: flex-start; background: var(--surface); border: 1px solid rgba(241, 154, 199, 0.35); border-bottom-left-radius: 4px; }
.agent { align-self: flex-start; background: transparent; border: 1px solid var(--border); color: var(--dim); }
.to { align-self: flex-end; background: transparent; border: 1px dashed var(--border); color: var(--dim); }
.info { align-self: center; max-width: 94%; padding: 2px 6px; font-size: 12px; color: var(--dim); text-align: center; }
.empty { margin: auto; color: var(--dim); font-size: 13px; text-align: center; }
#typerow { flex: none; display: flex; gap: 8px; }
#typerow[hidden] { display: none; }
#typein { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; outline: none; }
#typein:focus { border-color: var(--blue); }
#sendbtn { border-color: var(--blue); color: var(--blue); border-radius: 12px; }
#keybtn { position: absolute; left: 0; bottom: 8px; width: 52px; height: 52px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: var(--bg); }
#keybtn.on { color: var(--blue); border-color: var(--blue); }
#keybtn svg { width: 22px; height: 22px; }
#modebtn { --tone: var(--blue); display: none; position: absolute; left: 64px; right: 88px; top: 50%; transform: translateY(-50%); align-items: center; gap: 9px; min-width: 0; max-width: 340px; margin-inline: auto; padding: 8px 12px; border-radius: 999px; background: var(--surface); text-align: left; }
#modedot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 10px var(--tone); }
#modebtn.live #modedot { animation: modepulse 1.1s ease-in-out infinite; }
#modetext { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
#modeword { font: 600 12px ui-monospace, Menlo, monospace; letter-spacing: 1px; color: var(--tone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#modesub { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#modesub:empty { display: none; }
@keyframes modepulse { 50% { opacity: 0.45; transform: scale(0.75); } }
@media (prefers-reduced-motion: reduce) { #modebtn.live #modedot { animation: none; } }
@media (max-width: 760px), (max-height: 560px) {
  #app:not(.full) #corebox { height: 76px; min-height: 0; }
  #app:not(.full) #core { display: none; }
  #app:not(.full) #keybtn { bottom: 12px; }
  #app:not(.full) #modebtn { display: flex; }
}
@media (max-width: 420px) { .tag { display: none; } }
#app.short:not(.full):has(#typerow:not([hidden])) #corebox { display: none; }
#talkbtn { position: absolute; right: 0; bottom: 0; width: 76px; height: 76px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 50%; border: 2px solid var(--ok); color: var(--ok); background: var(--bg); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
#talkbtn svg { width: 26px; height: 26px; }
#talkword { font-size: 11px; line-height: 1.1; white-space: nowrap; pointer-events: none; }
#talkbtn.live { background: #1d2a1a; box-shadow: 0 0 0 6px rgba(158, 206, 106, 0.18), 0 0 26px rgba(158, 206, 106, 0.45); }
#info { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: flex-end; z-index: 5; }
#info[hidden] { display: none; }
.sheet { width: 100%; max-height: 82dvh; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.sheethead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#status { font-size: 12px; color: var(--wait); }
#status.on { color: var(--ok); }
#status.off { color: var(--bad); }
#list { list-style: none; margin: 8px 0 0; padding: 0; }
#list li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
#list li:last-child { border-bottom: 0; }
.mark { width: 1.2em; flex: none; }
.ok .mark { color: var(--ok); }
.bad .mark { color: var(--bad); }
.wait .mark { color: var(--wait); }
.detail { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
#hex { margin-top: 12px; font-size: 11px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<div id="app">
<header>
<div class="brand"><b>Nixa</b><span id="dot" class="dot"></span></div>
<div class="toggles">
<button id="soundbtn" class="tog" type="button" aria-label="Sound on this phone"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundwave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="soundword">Sound</span></button>
<button id="placebtn" class="tog" type="button" aria-label="Where Nixa speaks"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span id="placeword">Phone</span></button>
<button id="viewbtn" class="tog round" type="button" aria-label="Show only the Nixa core"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="3"/></svg></button>
<button id="infobtn" class="tog round" type="button" aria-label="Info and checks"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
</div>
</header>
<div id="hint" hidden></div>
<div id="chat"><div class="empty">No talk yet. Hold the green button and speak.</div></div>
<div id="corebox">
<canvas id="core"></canvas>
<button id="modebtn" type="button" aria-label="Show the Nixa core" title="Show the Nixa core"><span id="modedot"></span><span id="modetext"><span id="modeword">CONNECTING</span><span id="modesub"></span></span></button>
<button id="keybtn" type="button" aria-label="Type a message"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
<button id="talkbtn" type="button" aria-label="Hold or tap to talk"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg><span id="talkword">Talk</span></button>
</div>
<form id="typerow" hidden><input id="typein" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" placeholder="Type to Nixa"><button id="sendbtn" type="submit">Send</button></form>
</div>
<section id="info" hidden>
<div class="sheet">
<div class="sheethead"><b>Info</b><button id="infoclose" class="tog" type="button">Close</button></div>
<div id="status">connecting</div>
<ul id="list"></ul>
<div class="row"><button id="mic" type="button">Test mic</button><button id="sound" type="button">Test sound</button></div>
<div class="row"><button id="silencebtn" type="button">Auto-send after 3 seconds of silence</button></div>
<div class="row"><button id="wakebtn" type="button" aria-pressed="false">Wake word: off</button><span id="wakestate" class="detail" role="status"></span></div>
<div class="row" id="ask" hidden><span>Did you hear a beep?</span><button id="yes" type="button">Yes</button><button id="no" type="button">No</button></div>
<div id="hex">[ 0x4E 0x49 0x58 0x41 ] Nixa</div>
</div>
</section>
<script type="module" src="/app.js"></script>
</body>
</html>
