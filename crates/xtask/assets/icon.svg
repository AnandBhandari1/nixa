<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs><linearGradient id="nixa-icon-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2F5E"/><stop offset="1" stop-color="#0E1126"/></linearGradient></defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#nixa-icon-bg)"/>
<g transform="translate(152 140) scale(1.8)">
<defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C83FF"/>
      <stop offset="1" stop-color="#4B4FD9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F3B"/>
      <stop offset="1" stop-color="#0E1126"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD166" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .float   { animation: float 3.2s ease-in-out infinite; }
    .shadow  { animation: shadow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .head    { animation: tilt 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
    .eye     { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .pupils  { animation: look 6s ease-in-out infinite; }
    .orb     { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .halo    { animation: halo 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .gear    { animation: spin 5s linear infinite; transform-box: fill-box; transform-origin: center; }
    .dot     { animation: dot 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .d2      { animation-delay: .35s; }
    .d3      { animation-delay: .7s; }
    .chest   { animation: chest 2.4s steps(1) infinite; }
    .c2      { animation-delay: .8s; }
    .c3      { animation-delay: 1.6s; }
    .arm     { animation: tap 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 90%; }

    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .22; } 50% { transform: scaleX(.82); opacity: .12; } }
    @keyframes tilt   { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes blink  { 0%,44%,48%,100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }
    @keyframes look   { 0%,100% { transform: translate(-5px,-4px); } 50% { transform: translate(6px,-5px); } }
    @keyframes pulse  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes halo   { 0%,100% { transform: scale(.8); opacity: .35; } 50% { transform: scale(1.5); opacity: .8; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes dot    { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 25%,70% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-6px) scale(.8); } }
    @keyframes chest  { 0% { fill: #FFD166; } 33%,100% { fill: #2A2F66; } }
    @keyframes tap    { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dot { opacity: 1; }
    }
  </style>

  <ellipse class="shadow" cx="200" cy="362" rx="78" ry="11" fill="#1B1F3B"/>

  <g class="float">
    <circle class="dot"    cx="286" cy="118" r="7"  fill="#7C83FF"/>
    <circle class="dot d2" cx="308" cy="92"  r="10" fill="#7C83FF"/>
    <circle class="dot d3" cx="336" cy="60"  r="14" fill="#7C83FF"/>

    <rect x="140" y="232" width="120" height="96" rx="34" fill="url(#shell)"/>
    <rect x="160" y="254" width="80" height="40" rx="14" fill="#1B1F3B"/>
    <circle class="chest"    cx="180" cy="274" r="6" fill="#2A2F66"/>
    <circle class="chest c2" cx="200" cy="274" r="6" fill="#2A2F66"/>
    <circle class="chest c3" cx="220" cy="274" r="6" fill="#2A2F66"/>

    <rect x="152" y="320" width="38" height="20" rx="10" fill="#3A3EB8"/>
    <rect x="210" y="320" width="38" height="20" rx="10" fill="#3A3EB8"/>

    <rect x="116" y="246" width="26" height="62" rx="13" fill="#4B4FD9"/>
    <circle cx="129" cy="312" r="13" fill="#FFD166"/>

    <g class="arm">
      <path d="M262 290 Q292 286 284 244 Q280 226 262 224" fill="none" stroke="#4B4FD9" stroke-width="26" stroke-linecap="round"/>
      <circle cx="258" cy="222" r="14" fill="#FFD166"/>
    </g>

    <g class="head">
      <rect x="196" y="52" width="8" height="34" rx="4" fill="#3A3EB8"/>
      <circle class="halo" cx="200" cy="46" r="22" fill="url(#glow)"/>
      <circle class="orb"  cx="200" cy="46" r="10" fill="#FFD166"/>

      <rect x="92"  y="132" width="18" height="44" rx="9" fill="#3A3EB8"/>
      <rect x="290" y="132" width="18" height="44" rx="9" fill="#3A3EB8"/>

      <rect x="104" y="82" width="192" height="146" rx="52" fill="url(#shell)"/>
      <rect x="124" y="104" width="152" height="102" rx="34" fill="url(#screen)"/>

      <g class="pupils">
        <rect class="eye" x="156" y="132" width="24" height="36" rx="12" fill="#7CF5E6"/>
        <rect class="eye" x="220" y="132" width="24" height="36" rx="12" fill="#7CF5E6"/>
      </g>

      <path d="M188 186 q8 -6 16 0 q6 4 10 -1" fill="none" stroke="#7CF5E6" stroke-width="4" stroke-linecap="round"/>

      <g class="gear" opacity=".9">
        <path d="M258 96 l4 0 l1 5 l4 2 l4 -3 l3 3 l-3 4 l2 4 l5 1 l0 4 l-5 1 l-2 4 l3 4 l-3 3 l-4 -3 l-4 2 l-1 5 l-4 0 l-1 -5 l-4 -2 l-4 3 l-3 -3 l3 -4 l-2 -4 l-5 -1 l0 -4 l5 -1 l2 -4 l-3 -4 l3 -3 l4 3 l4 -2 z" fill="#FFD166"/>
        <circle cx="260" cy="114" r="5" fill="#4B4FD9"/>
      </g>
    </g>
  </g>
</g>
</svg>
